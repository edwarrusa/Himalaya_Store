{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6 bg-white p-8 rounded-2xl shadow-md">
    <div class="flex justify-between items-center border-b pb-4">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Editar Cotización #{{ cotizacion.id }}</h1>
            <p class="text-xs text-slate-500">Modifica los datos y productos de esta cotización pendiente.</p>
        </div>
        <a href="{{ url_for('cotizaciones') }}" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-medium hover:bg-slate-200 transition">
            ← Volver
        </a>
    </div>

    <form action="{{ url_for('editar_cotizacion', id=cotizacion.id) }}" method="POST" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Cliente</label>
                <select name="cliente_id" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    {% for c in clientes %}
                    <option value="{{ c.id }}" {{ 'selected' if c.id == cotizacion.cliente_id else '' }}>{{ c.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Validez (Días)</label>
                <input type="number" name="validez_dias" value="{{ cotizacion.validez_dias }}" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Fecha</label>
                <input type="date" name="fecha" value="{{ fecha_formato }}" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
        </div>

        <div class="border-t pt-4">
            <h3 class="text-sm font-semibold text-slate-800 mb-3">Productos en la Cotización</h3>
            
            <div id="productos-container" class="space-y-3">
                {% for detalle in cotizacion.detalles %}
                <div class="flex gap-2 items-center producto-row">
                    <select name="producto_id[]" required class="flex-1 px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        {% for p in productos %}
                        <option value="{{ p.id }}" {{ 'selected' if p.id == detalle.producto_id else '' }}>{{ p.nombre }} (${{ "%.2f"|format(p.precio) }})</option>
                        {% endfor %}
                    </select>
                    <input type="number" name="cantidad[]" value="{{ detalle.cantidad }}" min="1" required class="w-24 px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Cant">
                    <button type="button" onclick="this.parentElement.remove()" class="bg-red-50 text-red-600 px-3 py-2 rounded-xl text-xs font-bold hover:bg-red-100 transition">✕</button>
                </div>
                {% endfor %}
            </div>

            <button type="button" onclick="agregarFilaProducto()" class="mt-3 bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-medium hover:bg-slate-200 transition">
                + Agregar otro producto
            </button>
        </div>

        <div class="border-t pt-4 flex justify-end">
            <button type="submit" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 transition shadow-sm">
                Guardar Cambios
            </button>
        </div>
    </form>
</div>

<script>
function agregarFilaProducto() {
    const container = document.getElementById('productos-container');
    const primeraFila = container.querySelector('.producto-row');
    if (primeraFila) {
        const nuevaFila = primeraFila.cloneNode(true);
        nuevaFila.querySelector('input').value = '1';
        container.appendChild(nuevaFila);
    }
}
</script>
{% endblock %}
