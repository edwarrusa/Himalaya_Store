{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6 text-slate-900">Módulo de Clientes</h1>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="bg-white p-6 rounded-2xl shadow-md h-fit">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">👤 Nuevo Cliente</h2>
        <form action="/agregar_cliente" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
                <input type="text" name="nombre_cliente" required class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Teléfono</label>
                <input type="text" name="telefono_cliente" class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Dirección</label>
                <input type="text" name="direccion_cliente" class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <button type="submit" class="w-full bg-slate-800 text-white font-medium py-2 rounded-lg text-sm hover:bg-slate-900 transition">Guardar Cliente</button>
        </form>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-md lg:col-span-2">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">Directorio de Clientes</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="border-b text-xs text-slate-400 uppercase">
                        <th class="pb-2">Nombre</th>
                        <th class="pb-2">Teléfono</th>
                        <th class="pb-2">Dirección</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in clientes %}
                    <tr class="border-b last:border-none">
                        <td class="py-3 font-medium">{{ c.nombre }}</td>
                        <td class="py-3 text-slate-600">{{ c.telefono or 'N/A' }}</td>
                        <td class="py-3 text-slate-600">{{ c.direccion or 'N/A' }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="3" class="py-4 text-center text-slate-400 italic text-sm">Sin clientes registrados.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
