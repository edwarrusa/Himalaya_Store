{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
    <div class="text-center mb-6">
        <span class="text-3xl">🔑</span>
        <h1 class="text-xl font-bold text-slate-900 mt-2">Configuración de Cuenta</h1>
        <p class="text-xs text-slate-500 mt-1">Actualiza tu nombre de usuario o cambia tu contraseña de acceso.</p>
    </div>

    <form action="{{ url_for('cambiar_clave') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Nombre de Usuario</label>
            <input type="text" name="username" value="{{ current_user.username }}" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Contraseña Actual (Obligatoria para confirmar cambios)</label>
            <input type="password" name="password_actual" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Nueva Contraseña (Opcional si solo cambias el nombre)</label>
            <input type="password" name="password_nuevo" placeholder="Déjala en blanco si no deseas cambiarla" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-slate-900 text-white font-medium py-2.5 rounded-xl text-sm hover:bg-slate-800 transition shadow-sm">
            Guardar Cambios
        </button>
    </form>
</div>
{% endblock %}
