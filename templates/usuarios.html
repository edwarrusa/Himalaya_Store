{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6 text-slate-900">Gestión de Usuarios y Socios</h1>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="bg-white p-6 rounded-2xl shadow-md h-fit">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">👤 Nuevo Usuario</h2>
        <form action="/usuarios" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Nombre de Usuario</label>
                <input type="text" name="username" required class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Contraseña</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Rol / Permiso</label>
                <select name="rol" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                    <option value="Socio/Operador">Socio / Operador</option>
                    <option value="Administrador">Administrador</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-slate-800 text-white font-medium py-2 rounded-lg text-sm hover:bg-slate-900 transition">Crear Cuenta</button>
        </form>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-md lg:col-span-2">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">Equipo Registrado</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="border-b text-xs text-slate-400 uppercase">
                        <th class="pb-2">Usuario</th>
                        <th class="pb-2">Rol</th>
                        <th class="pb-2 text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in usuarios %}
                    <tr class="border-b last:border-none">
                        <td class="py-3 font-medium">🔹 {{ u.username }}</td>
                        <td class="py-3 text-slate-600 text-xs">
                            <span class="px-2 py-1 rounded bg-slate-100 font-semibold">{{ u.rol }}</span>
                        </td>
                        <td class="py-3 text-right">
                            <form action="{{ url_for('reset_password', id=u.id) }}" method="POST" class="inline-block" onsubmit="return confirm('¿Estás seguro de restablecer la contraseña de {{ u.username }} a la clave temporal (123456)?');">
                                <button type="submit" class="bg-amber-50 text-amber-600 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-amber-100 transition" title="Restablecer clave a 123456">
                                    🔄 Restablecer Clave
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
