{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-xl border border-slate-100">
    <h2 class="text-xl font-bold text-slate-900 mb-4">Editar Cliente: {{ cliente.nombre }}</h2>
    
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre / Razón Social</label>
            <input type="text" name="nombre" value="{{ cliente.nombre }}" required 
                   class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
        </div>
        
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Teléfono</label>
            <input type="text" name="telefono" value="{{ cliente.telefono or '' }}" 
                   class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
        </div>
        
        <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Dirección</label>
            <textarea name="direccion" rows="3" 
                      class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">{{ cliente.direccion or '' }}</textarea>
        </div>
        
        <div class="flex justify-end gap-3 pt-2">
            <a href="{{ url_for('clientes') }}" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl hover:bg-slate-200 transition">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl hover:bg-emerald-700 transition">Guardar Cambios</button>
        </div>
    </form>
</div>
{% endblock %}
